# Collects news and writes study notes on a schedule, straight into the production database.
# This replaces the in-process scheduler, which cannot be relied on when the API host sleeps.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL     the production PostgreSQL URL
#   GEMINI_API_KEY   the AI key
# Until DATABASE_URL is set, runs skip without failing.
name: News pipeline

on:
  schedule:
    - cron: "5 * * * *" # every hour (UTC)
  workflow_dispatch:

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: gemini
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD || '1.00' }}
      ENVIRONMENT: production
      JWT_SECRET: not-used-by-the-pipeline-but-required-in-production
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: pip install .
      - name: Migrate and seed
        if: steps.config.outputs.ready == 'true'
        run: |
          alembic upgrade head
          python -m app.cli seed
      - name: Collect
        if: steps.config.outputs.ready == 'true'
        run: python -m app.cli collect
      - name: Process
        if: steps.config.outputs.ready == 'true'
        run: python -m app.cli process --limit 20
      - name: Show a sample
        if: steps.config.outputs.ready == 'true'
        run: python -m app.cli sample
      - name: Daily cleanup
        if: steps.config.outputs.ready == 'true' && github.event.schedule == '5 * * * *'
        run: |
          if [ "$(date -u +%H)" = "20" ]; then python -m app.cli cleanup; fi
